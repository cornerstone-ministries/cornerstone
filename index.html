<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornerstone Database</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
/* Layout: sticky masthead with four tabs over a single 960px column; member details and the editor open as a sheet. */
:root{
  --bg:#f3f7f0; --surface:#ffffff; --ink:#12241a; --muted:#4f6b58; --line:#d5e2d6;
  --accent:#17703a; --accent-ink:#ffffff; --accent-soft:#dff0e2;
  --gold:#7a6200; --gold-soft:#fdf5c4; --gold-solid:#f7e11b; --gold-solid-ink:#1a1a00;
  --danger:#c8202f; --danger-soft:#fbe0e2; --overlay:rgba(8,18,16,.55);
  --shadow:0 1px 2px rgba(20,40,36,.06),0 10px 28px rgba(20,40,36,.10);
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1610; --surface:#142019; --ink:#e6f0e8; --muted:#9bb5a2; --line:#24362a;
    --accent:#4fce7f; --accent-ink:#06140b; --accent-soft:#163322;
    --gold:#f7e11b; --gold-soft:#3a3510; --gold-solid:#f7e11b; --gold-solid-ink:#1a1a00;
    --danger:#ff7a85; --danger-soft:#3a1d20; --overlay:rgba(0,0,0,.6);
    --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1610; --surface:#142019; --ink:#e6f0e8; --muted:#9bb5a2; --line:#24362a;
  --accent:#4fce7f; --accent-ink:#06140b; --accent-soft:#163322;
  --gold:#f7e11b; --gold-soft:#3a3510; --gold-solid:#f7e11b; --gold-solid-ink:#1a1a00;
  --danger:#ff7a85; --danger-soft:#3a1d20; --overlay:rgba(0,0,0,.6);
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 8px}
.brand{min-width:0}
.brand small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{margin-left:6px;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}

main{padding-block:20px 80px}
h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}

/* buttons and fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bday{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr);gap:8px}

/* toolbar + directory */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar select{width:auto;flex:0 1 190px}
.count{color:var(--muted);font-size:13px;margin:0 0 8px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:15px;flex:none}
.avatar.lg{width:52px;height:52px;font-size:18px}
.who{min-width:0}
.who b{display:block;font-weight:600;overflow-wrap:anywhere}
.who span{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;border:0}
.chip.tag{background:var(--gold-soft);color:var(--gold)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.bd{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:46ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* birthdays */
.bhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.bhead .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.today{background:var(--gold-soft);border:1px solid var(--gold-solid);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.today b{color:var(--gold)}
.bmonth{margin-bottom:22px}
.bmonth h3{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px}
.bmonth h3 span{color:var(--muted);font:500 13px var(--body)}
.bitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.bitem:last-child{border-bottom:0}
.bitem.passed{opacity:.55}
.bitem:hover{background:var(--accent-soft)}
.day{width:46px;text-align:center;border-radius:10px;background:var(--gold-soft);color:var(--gold);padding:4px 0;line-height:1.1}
.day b{display:block;font:700 18px var(--display);font-variant-numeric:tabular-nums}
.day i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.day.now{background:var(--gold-solid);color:var(--gold-solid-ink)}
.when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}

/* ministries */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.mcard header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.mcard h3{margin:0;font-family:var(--display);font-size:17px;overflow-wrap:anywhere}
.mcard .num{font:700 22px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.mcard .none{color:var(--muted);font-size:13px;margin:0}

/* settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.panel h2{margin-bottom:4px}
.panel .sub{margin-bottom:14px}
.mlist{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.mlist li span{overflow-wrap:anywhere}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow input{flex:1 1 200px}
.status{font-size:13px;color:var(--muted);margin:0}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--danger)}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:660px;max-height:94%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet:focus{outline:none}
@media (min-width:720px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px;padding:24px}}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:16px}
.shead h2{font-size:22px;overflow-wrap:anywhere}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0 0 16px}
dl.facts dt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec h3{font-family:var(--display);font-size:16px;margin:0 0 10px}
.fam{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.fam li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.fam .rel{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.famrow{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.famrow .top2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.foot .lead{margin-right:auto}
.err{color:var(--danger);font-size:13px;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none!important}
.loading{color:var(--muted);padding:30px 0;text-align:center}
@media (max-width:520px){.row{grid-template-columns:auto minmax(0,1fr)}.row .bd{grid-column:2}.brand h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.brand h1{text-transform:uppercase;letter-spacing:.14em}

#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(1200px 600px at 50% -10%,#1b7a43 0%,#0f4d2a 55%,#0a3820 100%)}
#login[hidden]{display:none}
body.locked header.top,body.locked #app{visibility:hidden}
.lbox{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:22px}
.llogo{display:block;width:min(340px,80%);height:auto}
.lcard{width:100%;background:#fff;color:#12241a;border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:4px solid #f7e11b;display:flex;flex-direction:column;gap:14px}
.lcard h2{margin:0;font-size:22px;letter-spacing:-.01em}
.lsub{margin:-6px 0 4px;color:#5b6b60;font-size:14px}
.lhint{margin:-6px 0 0;color:#5b6b60;font-size:13px}
.lcard label,.ucard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#33453a}
.lcard input,.ucard input,.ucard select{font:inherit;font-weight:400;padding:11px 12px;border:1px solid #c9d6cc;border-radius:10px;background:#fff;color:#12241a}
.lcard input:focus,.ucard input:focus,.ucard select:focus{outline:2px solid #17703a;outline-offset:1px;border-color:#17703a}
.lerr{min-height:18px;color:#c8202f;font-size:13.5px;font-weight:600}
.lbtn{width:100%;padding:12px 16px}
.who{margin-left:auto;margin-right:12px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.who .wname em{font-style:normal;font-size:12px;margin-left:4px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
@media(max-width:640px){.who .wname{display:none}}
.utable{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--line,#d9e3db);border-radius:12px;background:var(--card,#fff)}
.utable table{width:100%;border-collapse:collapse;font-size:14px}
.utable th,.utable td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line,#e3ebe5);vertical-align:middle}
.utable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.utable tr:last-child td{border-bottom:0}
.utable .uact{text-align:right;white-space:nowrap}
.ustat{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.ustat.on{background:var(--accent-soft);color:var(--accent)}
.ustat.off{background:#f6e3e5;color:#c8202f}
.ugrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.ucard{background:var(--card,#fff);border:1px solid var(--line,#d9e3db);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ucard h3{margin:0 0 2px;font-size:16px}

#chooser{position:fixed;inset:0;z-index:900;overflow:auto;padding:28px 16px;display:flex;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#1b7a43 0%,#0f4d2a 55%,#0a3820 100%)}
#chooser[hidden]{display:none}
.cwrap{width:min(880px,100%);display:flex;flex-direction:column;align-items:center;gap:22px;margin-block:auto}
.ctitle{color:#fff;text-align:center}
.ctitle h2{color:#fff;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em}
.ctitle p{margin:6px 0 0;color:rgba(255,255,255,.8)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%}
.pcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:250px;text-align:center;background:#fff;color:#12241a;border:0;border-top:4px solid #f7e11b;border-radius:16px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:transform .12s ease,box-shadow .12s ease}
.pcard:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 26px 56px rgba(0,0,0,.38)}
.pcard:focus-visible{outline:3px solid #f7e11b;outline-offset:3px}
.pcard:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.7)}
.pcard b{font-size:20px;line-height:1.2}
.pcard small{color:#5b6b60;font-size:13.5px}
.pcard.church{min-height:190px}
.pbrand{display:flex;justify-content:center;background:#0f4d2a;border-radius:12px;padding:12px 16px;width:100%}
.pbrand img{width:min(250px,100%);height:auto;display:block}
.picon{color:#17703a;display:flex;align-items:center;justify-content:center;min-height:86px}
.cnote{color:#fff;text-align:center;margin:0}
.pfoot{display:flex;gap:10px}
.locchip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-solid)}
@media(max-width:820px){.locchip{display:none}}
.printonly{display:none}
.attbar{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.attbar .field{min-width:150px}
.attnav{display:flex;align-items:flex-end;gap:8px}
.attnav .btn{height:40px;min-width:40px;font-size:20px;padding:0 10px}
input[type=date],input[type=month]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.attwrap{padding:14px 10px 6px}
.achart{width:100%;height:auto;display:block}
.attempty{margin:0;padding:34px 10px;text-align:center;color:var(--muted)}
.agrid{stroke:var(--line);stroke-width:1}
.aaxis{stroke:var(--muted);stroke-width:1.2}
.atick{stroke:var(--muted);stroke-width:1.2}
.aguide{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.atxt{fill:var(--muted);font-size:12.5px}
.atxt.asmall{font-size:11px;opacity:.85}
.aval{fill:var(--ink);font-size:13px;font-weight:700}
.alegend{fill:var(--ink);font-size:14px;font-weight:600}
.aline{fill:none;stroke-width:2.6;stroke-linejoin:round}
.aline.aS{stroke:var(--accent)}
.aline.aP{stroke:#5b8def}
.aline.aR{stroke:var(--danger);stroke-dasharray:8 5}
.amk.aS{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.amk.aP{fill:#5b8def;stroke:var(--surface);stroke-width:1.5}
.amk.aR{fill:var(--danger);stroke:var(--surface);stroke-width:1.5}
.astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.astats .panel{margin-bottom:0}
.astats+.panel{margin-top:16px}
.astat h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.adot{width:11px;height:11px;display:inline-block}
.adot.aS{background:var(--accent);border-radius:50%}
.adot.aP{background:#5b8def}
.adot.aR{background:var(--danger)}
.astat dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
.astat dt{color:var(--muted)}
.astat dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.astat dd small{font-weight:400;color:var(--muted)}
.tscroll{overflow-x:auto}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th,.atable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.atable th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.atable .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.atable .atact{text-align:right;white-space:nowrap}
.panel h3{margin:0 0 10px;font-size:16px}
.arec{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:8px}
@media print{
  @page{margin:13mm}
  html,body{background:#fff!important;color:#000!important}
  header.top,.noprint,.toast,#toast,#login,#chooser,#modal{display:none!important}
  main.wrap{max-width:none!important;padding:0!important;margin:0!important}
  .printonly{display:block!important}
  .panel{border:0!important;box-shadow:none!important;background:none!important;padding:6px 0!important;margin:0 0 8px!important}
  .attwrap{padding:0!important}
  .astats{grid-template-columns:1fr 1fr;gap:10px}
  .atprinthead{text-align:center;margin-bottom:10px}
  .atbanner{display:flex;justify-content:center;background:#0f4d2a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:8px;padding:8px}
  .atbanner img{height:54px;width:auto}
  .atprinthead h1{font-size:22px;margin:10px 0 0;color:#000;text-transform:uppercase;letter-spacing:.06em}
  .atprinthead h2{font-size:16px;margin:2px 0 6px;color:#000}
  .atprinthead p{margin:2px 0;color:#000;font-size:13px}
  .atprinthead .atsmall{font-size:11px;color:#444}
  .atxt,.aval,.alegend,.astat dt,.astat dd,.astat dd small,.atable th,.atable td{color:#000!important;fill:#000}
  .atxt{fill:#333}
  .aline.aS{stroke:#0f5a2c!important}.aline.aP{stroke:#b01020!important}
  .amk.aS{fill:#0f5a2c!important;stroke:#fff!important}.amk.aP{fill:#b01020!important;stroke:#fff!important}
  .agrid,.aguide{stroke:#ccc!important}.aaxis,.atick{stroke:#333!important}
  .adot.aS{background:#0f5a2c!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.adot.aP{background:#4a7dd8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.adot.aR{background:#b01020!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .atable tr{page-break-inside:avoid}
  .atable td,.atable th{border-bottom:1px solid #bbb!important}
  .achart{max-height:105mm}
}
.brandwrap{display:flex;align-items:center;background:#0f4d2a;padding:9px 16px;border-radius:12px}.logo{display:block;width:min(360px,60vw);height:auto}.attview{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
/* demographics */
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:18px}
.demo-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.demo-card h3{margin:0 0 12px;font-size:16px}
.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.pie-legend span{display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.pie-swatch{width:12px;height:12px;border-radius:3px;flex:none}
.demo-stat{font-size:36px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* member dashboard */
.dash-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.dash-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.dash-stat b{display:block;font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}
.dash-stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
/* checklist */
.checklist{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin:8px 0}
.cl-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.cl-row:last-child{border-bottom:0}
.cl-row label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.cl-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.cl-count{font-size:13px;color:var(--muted);margin:4px 0 0}
/* badge */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.badge.inactive{background:var(--danger-soft);color:var(--danger)}
.badge.transferred{background:var(--gold-soft);color:var(--gold)}
/* sort buttons */
.sort-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sort-btn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.sort-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
/* social media in view */
.sm-links{display:flex;flex-wrap:wrap;gap:8px}
.sm-link{font-size:13px;color:var(--accent);font-weight:600}
.vbtn{flex:1 1 170px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.vbtn b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.vbtn span{font-size:12.5px;color:var(--muted)}
.vbtn.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.vbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.attcap{margin:0 0 6px 10px;font-weight:600}

/* ---- Apple-style look and motion ---- */
:root{
--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
--display:var(--sys);--body:var(--sys);
--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.32,.72,0,1);
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.08);
}
body{font-family:var(--sys);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:-.011em;font-size:16px}
h1,h2,h3,.brand h1,.pcard b,.ctitle h2,.lcard h2{font-family:var(--sys);letter-spacing:-.022em;font-weight:700}
.brand h1{text-transform:none;letter-spacing:-.02em;font-size:22px}
.brand small{letter-spacing:.04em}
.top{background:color-mix(in srgb,var(--surface) 76%,transparent);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.btn{border-radius:11px;border-color:transparent;background:color-mix(in srgb,var(--ink) 7%,transparent);font-weight:600;transition:transform .22s var(--ease),background-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.btn:hover{border-color:transparent;background:color-mix(in srgb,var(--ink) 11%,transparent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.07)}
.btn.danger{background:var(--danger-soft);border-color:transparent}
.btn:active,.pcard:active:not(:disabled),.vbtn:active,.pick:active,.tab:active{transform:scale(.965)}
.btn:disabled{opacity:.55}
.tab{transition:color .25s ease,border-color .3s var(--ease),transform .2s var(--ease)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],input[type=date],input[type=month],select,textarea,.lcard input,.ucard input,.ucard select{border-radius:11px;border-color:color-mix(in srgb,var(--line) 90%,transparent);transition:border-color .2s ease,box-shadow .25s var(--ease)}
input:focus,select:focus,textarea:focus,.lcard input:focus{outline:none!important;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.list,.panel,.mcard,.empty,.ucard,.utable{border-radius:16px;border-color:color-mix(in srgb,var(--line) 75%,transparent)}
.list,.panel,.mcard{box-shadow:0 1px 2px rgba(0,0,0,.03)}
.row,.bitem,.mcard,.vbtn,.pick,.chip{transition:background-color .2s ease,transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s ease}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sheet{border-radius:22px 22px 0 0}
@media (min-width:720px){.sheet{border-radius:22px}}
.lcard,.pcard{border-radius:20px;border-top-width:0;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.pcard{transition:transform .35s var(--spring),box-shadow .35s var(--spring)}
.pcard:hover:not(:disabled){transform:translateY(-4px) scale(1.015)}
.lbtn{border-radius:12px;padding:13px 16px;font-size:16px}
.toast{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:color-mix(in srgb,var(--ink) 88%,transparent);animation:toastin .38s var(--spring) both}
.toast[hidden]{animation:none}
.avatar{transition:transform .25s var(--ease)}
.row:hover .avatar{transform:scale(1.06)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#app.fx{animation:rise .42s var(--ease) both}
#login:not([hidden]) .lbox,#chooser:not([hidden]) .cwrap{animation:rise .5s var(--ease) both}
#login:not([hidden]),#chooser:not([hidden]){animation:fadein .35s ease both}
#chooser .pcard{animation:rise .55s var(--ease) both}
#chooser .pcard:nth-child(2){animation-delay:.06s}
#chooser .pcard:nth-child(3){animation-delay:.1s}
#chooser .pcard:nth-child(n+4){animation-delay:.14s}
#modal.fresh .overlay{animation:fadein .28s ease both}
#modal.fresh .sheet{animation:sheetin .45s var(--spring) both}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#chooser .btn{background:rgba(255,255,255,.18);color:#fff}#chooser .btn:hover{background:rgba(255,255,255,.28)}
</style>

<script>
(function(){
'use strict';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=MONTHS.map(m=>m.slice(0,3));
const REL=['Spouse','Child','Parent','Sibling','Grandparent','Grandchild','Other'];
const STATUS=['Member','Regular attendee','Visitor','Inactive','Transferred'];
const GENDERS=['Male','Female'];
const SM_PLATFORMS=['Facebook','Instagram','Twitter/X','TikTok','YouTube','Other'];
const DEFAULT_MIN=['Worship Team','Ushering','Youth','Children','Prayer','Media','Hospitality',"Men's Fellowship","Women's Fellowship",'Outreach'];
const LS_KEY='church-directory-v1';

const S={members:[],settings:{church:'Cornerstone',ministries:DEFAULT_MIN.slice()},view:'directory',q:'',fMin:'',fStatus:'',fFamily:'',sort:'alpha',incFam:true,modal:null,mode:'pending',loaded:false,confirmMin:'',canDl:false,err:''};
let toastTimer=0;
const dl=null; // CSV export is done from the sheet itself (File > Download)

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=id=>S.members.find(m=>m.id===id);
const fullName=m=>((m&&m.first||'')+' '+(m&&m.last||'')).trim()||'Unnamed';
const initials=m=>((m.first||'?')[0]+(m.last||'')[0]||'').toUpperCase();
const validB=b=>b&&b.m>0&&b.d>0;
const leap=y=>y%4===0&&(y%100!==0||y%400===0);
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const mkDate=(y,m,d)=>new Date(y,m-1,(m===2&&d===29&&!leap(y))?28:d);
function daysUntil(m,d){const t=today();let dt=mkDate(t.getFullYear(),m,d);if(dt<t)dt=mkDate(t.getFullYear()+1,m,d);return Math.round((dt-t)/864e5)}
function nextYear(m,d){const t=today();return mkDate(t.getFullYear(),m,d)<t?t.getFullYear()+1:t.getFullYear()}
const bText=(b,withYear)=>validB(b)?MS[b.m-1]+' '+b.d+(withYear&&b.y?', '+b.y:''):'';
const relDays=n=>n===0?'Today':n===1?'Tomorrow':'In '+n+' days';
const sortedMembers=()=>{const arr=S.members.slice();if(S.sort==='family')return arr.sort((a,b)=>(a.last||'').localeCompare(b.last||'')||(a.first||'').localeCompare(b.first||''));if(S.sort==='ministry')return arr.sort((a,b)=>((a.ministries||[])[0]||'zzz').localeCompare((b.ministries||[])[0]||'zzz')||(a.last||'').localeCompare(b.last||''));if(S.sort==='recent')return arr.reverse();return arr.sort((a,b)=>{const na=(a.first||'')+' '+(a.last||''),nb=(b.first||'')+' '+(b.last||'');return na.localeCompare(nb)})};
const famName=f=>{const m=f.linkId&&byId(f.linkId);return m?fullName(m):(f.name||'')};
const allMinistries=()=>{const set=new Set(S.settings.ministries);S.members.forEach(m=>(m.ministries||[]).forEach(x=>set.add(x)));return [...set]};
const allFamilies=()=>{const set=new Set();S.members.forEach(m=>{if(m.last)set.add(m.last)});return [...set].sort()};
function memberAge(m){if(!validB(m.birthday)||!m.birthday.y)return null;const t=today();let a=t.getFullYear()-m.birthday.y;if(t.getMonth()+1<m.birthday.m||(t.getMonth()+1===m.birthday.m&&t.getDate()<m.birthday.d))a--;return a}
function dateStr(d){if(!d)return '';if(typeof d==='string')return d;if(d.m&&d.d&&d.y)return MS[d.m-1]+' '+d.d+', '+d.y;return ''}

function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},2800)}

/* ---------- storage: the Google Sheet, through Apps Script ---------- */
var API_URL='https://script.google.com/macros/s/AKfycbw4z3YBdn6Aw1vwcMXmT3e_BFubR47vs4xBMqyMDndtVH0vSfhs3Sq8q_342FBkqbxSZA/exec';
function gs(fn){
  var args=Array.prototype.slice.call(arguments,1);
  if(!OPEN_FNS[fn])args=[TOKEN].concat(LOC_FNS[fn]?[LOCKEY]:[]).concat(args);
  return fetch(API_URL,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json()},function(){throw new Error('Cannot reach the server. Check your internet connection and try again.')})
    .then(function(o){
      if(!o||!o.ok){var msg=String(o&&o.e?o.e:'Something went wrong.').replace(/^Error:\s*/,'');if(msg.indexOf('SESSION_EXPIRED')>=0)lockApp();throw new Error(msg)}
      return o.r;
    });
}
var OPEN_FNS={authStatus:1,login:1,setupAdmin:1};
async function putMember(rec){
  await gs('saveMember',JSON.stringify(rec));
  const i=S.members.findIndex(m=>m.id===rec.id);if(i>=0)S.members[i]=rec;else S.members.push(rec);render();
}
async function removeMember(id){
  await gs('deleteMember',id);S.members=S.members.filter(m=>m.id!==id);render();
}
async function putSettings(){
  await gs('saveSettings',JSON.stringify(S.settings));render();
}
async function reload(){
  const d=JSON.parse(await gs('getAll'));
  S.members=d.members||[];
  if(d.settings)S.settings={church:d.settings.church||'Cornerstone',ministries:Array.isArray(d.settings.ministries)?d.settings.ministries:DEFAULT_MIN.slice()};
  S.loaded=true;S.mode='sheet';S.err='';render();
}
async function initStore(){
  try{await reload()}catch(e){S.loaded=true;S.mode='error';S.err=e.message||'Unknown error';render()}
  setInterval(()=>{
    const a=document.activeElement&&document.activeElement.tagName;
    if(S.modal||a==='INPUT'||a==='TEXTAREA'||a==='SELECT'||document.hidden)return;
    reload().catch(()=>{});
  },60000);
}

/* ---------- sign-in, sessions and user management ---------- */
var TOKEN='',ME=null,USERS=[],started=false,armed='';
function saveTok(t){try{sessionStorage.setItem('cdb_t',t)}catch(e){}}
function hideAuth(){var el=$('#login');el.hidden=true;el.innerHTML='';document.body.classList.remove('locked')}
function showAuth(mode,note){
  var el=$('#login'),setup=mode==='setup',logo=(document.querySelector('.logo')||{}).src||'';
  document.body.classList.add('locked');el.hidden=false;
  el.innerHTML='<div class="lbox"><img class="llogo" src="'+logo+'" alt="Cornerstone Fundamental Baptist Church">'
   +'<form class="lcard" id="authForm">'
   +'<h2>'+(setup?'Create the administrator account':'Sign in')+'</h2>'
   +'<p class="lsub">'+(setup?'First-time setup. This account manages everyone else&rsquo;s logins.':'Cornerstone Database &middot; authorized members only')+'</p>'
   +(setup?'<label>Full name<input id="aName" autocomplete="name" required></label>':'')
   +'<label>Username<input id="aUser" autocomplete="username" autocapitalize="none" required></label>'
   +'<label>Password<input id="aPass" type="password" autocomplete="'+(setup?'new-password':'current-password')+'" required></label>'
   +(setup?'<label>Confirm password<input id="aPass2" type="password" autocomplete="new-password" required></label><p class="lhint">At least 8 characters.</p>':'')
   +'<div class="lerr" id="aErr" role="alert">'+(note||'')+'</div>'
   +'<button class="btn primary lbtn" id="aBtn" type="submit">'+(setup?'Create account':'Sign in')+'</button>'
   +'</form></div>';
  var f=$(setup?'#aName':'#aUser');if(f)f.focus();
}
async function boot(){
  try{TOKEN=sessionStorage.getItem('cdb_t')||''}catch(e){}
  render();
  if(!TOKEN){showAuth('login');gs('authStatus','').catch(function(){});return}
  var st;
  try{st=JSON.parse(await gs('authStatus',TOKEN))}
  catch(e){showAuth('login','Cannot reach the server. Please reload the page.');return}
  if(st.state==='ok'){ME=st.user;startApp()}else showAuth(st.state);
}
function errText(ex){return String(ex&&ex.message?ex.message:ex).replace(/^Error:\s*/,'')}
document.addEventListener('submit',async function(e){
  if(e.target.id!=='authForm')return;
  e.preventDefault();
  var err=$('#aErr'),btn=$('#aBtn');err.textContent='';
  var u=$('#aUser').value.trim().toLowerCase(),p=$('#aPass').value;
  btn.disabled=true;btn.textContent='Please wait\u2026';
  try{
    var r=JSON.parse(await gs('login',u,p));
    TOKEN=r.token;ME=r.user;saveTok(TOKEN);startApp();
  }catch(ex){err.textContent=errText(ex);btn.disabled=false;btn.textContent='Sign in';$('#aPass').value=''}
});
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-uact="logout"]');if(!el)return;
  try{await gs('logout')}catch(x){}
  lockApp();
});
/* ---------- places: Cornerstone Main Limay / Other Missions-Churches ---------- */
var LOCKEY='',LOCNAME='';
var LOC_FNS={getAll:1,saveMember:1,deleteMember:1,saveSettings:1,getAttendance:1,saveAttendance:1,deleteAttendance:1,getMemberAttendance:1};
function churchIcon(px){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M30 2h4v5h5v4h-5v4h-4v-4h-5V7h5z M32 16l11 12v12h13v20H8V40h13V28z M27 60V49a5 5 0 0 1 10 0v11z"/></svg>';
}
function logoSrc(){return (document.querySelector('.logo')||{}).src||''}
function hideChooser(){var el=$('#chooser');el.hidden=true;el.innerHTML='';document.body.classList.remove('locked')}
function showChooser(step){
  var el=$('#chooser'),acc=(ME&&ME.access)||{main:false,churches:[]},ch=acc.churches||[],h='';
  document.body.classList.add('locked');el.hidden=false;
  if(step==='churches'){
    h='<div class="cwrap"><div class="ctitle"><h2>Other Missions/Churches</h2><p>Choose the church you want to open.</p></div><div class="pgrid">';
    ch.forEach(function(n){h+='<button class="pcard church" type="button" data-church="'+esc(n)+'"><span class="picon">'+churchIcon(64)+'</span><b>'+esc(n)+'</b></button>'});
    h+='</div>';
    if(!ch.length)h+='<p class="cnote">No churches are available to you yet. '+(acc.all?'Add them in the <b>Churches</b> tab of the sheet.':'Please ask the administrator.')+'</p>';
    h+='<div class="pfoot"><button class="btn" type="button" data-pick="back">&larr; Back</button></div></div>';
  }else{
    h='<div class="cwrap"><div class="ctitle"><h2>Where would you like to go?</h2><p>Signed in as '+esc(ME?ME.name:'')+'</p></div><div class="pgrid">'
     +'<button class="pcard" type="button" data-pick="main"'+(acc.main?'':' disabled')+'><span class="pbrand"><img src="'+logoSrc()+'" alt=""></span><b>Cornerstone Main Limay</b><small>'+(acc.main?'Directory &middot; Birthdays &middot; Ministries &middot; Attendance':'No access')+'</small></button>'
     +'<button class="pcard" type="button" data-pick="others"'+(ch.length?'':' disabled')+'><span class="picon">'+churchIcon(84)+'</span><b>Other Missions/Churches</b><small>'+(ch.length?(ch.length+(ch.length===1?' church':' churches')):(acc.all?'None added yet':'No access'))+'</small></button>'
     +'</div><div class="pfoot"><button class="btn" type="button" data-uact="logout">Sign out</button></div></div>';
  }
  el.innerHTML=h;window.scrollTo(0,0);
}
function renderWho(){
  var w=$('#who');if(!w)return;
  w.innerHTML=ME?(LOCNAME?'<span class="locchip">'+esc(LOCNAME)+'</span><button class="btn" data-uact="switch" type="button">Change location</button>':'')+'<span class="wname">'+esc(ME.name)+'</span><button class="btn" data-uact="logout" type="button">Sign out</button>':'';

function clearPlace(){
  LOCKEY='';LOCNAME='';S.members=[];S.loaded=false;S.modal=null;S.view='directory';
  ATT.rows=[];ATT.loaded=false;ATT.err='';AU.edit=false;AU.armed='';
}
function lockApp(){
  TOKEN='';ME=null;USERS=[];saveTok('');clearPlace();
  hideChooser();render();renderWho();showAuth('login');
}
function startApp(){
  hideAuth();clearPlace();renderWho();showChooser('home');
}
function enterPlace(key,name){
  clearPlace();LOCKEY=key;LOCNAME=name;
  S.settings={church:name,ministries:DEFAULT_MIN.slice()};S.q='';S.fMin='';S.fStatus='';
  hideChooser();renderWho();render();
  if(started){reload().catch(function(e){toast(errText(e))})}else{started=true;initStore()}
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-pick],[data-church],[data-uact="switch"]');if(!el||el.disabled)return;
  if(el.dataset.uact==='switch'){clearPlace();renderWho();render();showChooser('home');return}
  if(el.dataset.church){enterPlace('church:'+el.dataset.church,el.dataset.church);return}
  var p=el.dataset.pick;

  else if(p==='others')showChooser('churches');
  else if(p==='back')showChooser('home');

/* ---------- attendance: record, graph, print ---------- */
var ATT={rows:[],loaded:false,err:''};
var AU={mode:'month',month:'',week:'',n:8,from:'',to:'',svc:'both',view:'members',edit:false,armed:''};
var AF={d:'',s:'Sunday AM Service',n:'',v:'',note:'',cl:[]};
var SVCS=['Sunday AM Service','Sunday PM Service','Prayer Meeting'];
var DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function atVal(r){return AU.view==='visitors'?(r.v||0):AU.view==='total'?r.n+(r.v||0):r.n}
function atViewName(){return AU.view==='visitors'?'Visitors only':AU.view==='total'?'Total attendance (members + visitors)':'Members / regular attendees'}
function atViewShort(){return AU.view==='visitors'?'visitors':AU.view==='total'?'total':'members'}
function atPad(n){return n<10?'0'+n:''+n}
function atYmd(d){return d.getFullYear()+'-'+atPad(d.getMonth()+1)+'-'+atPad(d.getDate())}
function atPd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function atAdd(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function atFmt(s,y){var d=atPd(s);return MS[d.getMonth()]+' '+d.getDate()+(y?', '+d.getFullYear():'')}
function atLong(s){var d=atPd(s);return DOWS[d.getDay()]+', '+MS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function atRange(){
  var td=atYmd(new Date()),f,t,label,d,s;
  if(AU.mode==='week'){d=atPd(AU.week||td);s=atAdd(d,-d.getDay());f=atYmd(s);t=atYmd(atAdd(s,6));label='Week of '+atFmt(f)+' – '+atFmt(t,true)}
  else if(AU.mode==='last'){d=atPd(td);s=atAdd(d,-d.getDay()-7*(AU.n-1));f=atYmd(s);t=td;label='Last '+AU.n+' weeks ('+atFmt(f)+' – '+atFmt(t,true)+')'}
  else if(AU.mode==='custom'){f=AU.from||atYmd(atAdd(atPd(td),-30));t=AU.to||td;if(f>t){var x=f;f=t;t=x}label=atFmt(f,true)+' – '+atFmt(t,true)}
  else{var m=(AU.month||td.slice(0,7)).split('-'),y=+m[0],mo=+m[1];f=atYmd(new Date(y,mo-1,1));t=atYmd(new Date(y,mo,0));label=MONTHS[mo-1]+' '+y}
  return {f:f,t:t,label:label};
}
function atStats(rows){
  var o={};
  SVCS.forEach(function(s){
    var r=rows.filter(function(x){return x.s===s});if(!r.length)return;
    var tot=0,sm=0,sv=0,mx=r[0],mn=r[0];
    r.forEach(function(x){tot+=x.n;sm+=x.m;sv+=x.v;if(x.n>mx.n)mx=x;if(x.n<mn.n)mn=x});
    o[s]={n:r.length,tot:tot,sm:sm,sv:sv,avg:Math.round(tot/r.length*10)/10,mx:mx,mn:mn};
  });
  return o;
}
function atNice(mx){
  if(mx<=0)return {top:5,step:1};
  var raw=mx/5,p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),c=[1,2,5,10],st=p*10;
  for(var i=0;i<c.length;i++){if(c[i]*p>=raw){st=c[i]*p;break}}
  st=Math.max(1,st);
  var top=Math.ceil(mx/st)*st;if(top<=mx)top+=st;
  return {top:top,step:st};
}
function atTicks(f,t){
  var d0=atPd(f),d1=atPd(t),days=Math.round((d1-d0)/864e5),out=[],d;
  if(days<=120){var step=days<=45?7:14;d=atAdd(d0,(7-d0.getDay())%7);for(;atYmd(d)<=t;d=atAdd(d,step))out.push(atYmd(d))}
  else{var sm=days<=400?1:3;d=new Date(d0.getFullYear(),d0.getMonth()+(d0.getDate()>1?1:0),1);for(;atYmd(d)<=t;d=new Date(d.getFullYear(),d.getMonth()+sm,1))out.push(atYmd(d))}
  if(!out.length)out.push(f);
  return out;
}
function atChart(rows,f,t){
  if(!rows.length)return '<p class="attempty">No attendance has been recorded for this period yet.</p>';
  var W=920,H=410,L=58,R=24,T=56,B=74,pw=W-L-R,ph=H-T-B,padx=20;
  var d0=atPd(f).getTime(),d1=atPd(t).getTime(),span=Math.max(d1-d0,86400000);
  function X(s){return L+padx+(atPd(s).getTime()-d0)/span*(pw-2*padx)}
  var mx=0;rows.forEach(function(r){if(r.n>mx)mx=r.n});
  var sc=atNice(mx);
  function Y(v){return T+ph-(v/sc.top)*ph}
  var o='<svg class="achart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Attendance chart for '+esc(LOCNAME)+'">',v,y;
  for(v=0;v<=sc.top+0.0001;v+=sc.step){y=Y(v);o+='<line class="agrid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="atxt" x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+v+'</text>'}
  o+='<text class="atxt" transform="translate(14,'+(T+ph/2)+') rotate(-90)" text-anchor="middle">People</text>';
  var base=T+ph;
  o+='<line class="aaxis" x1="'+L+'" x2="'+(W-R)+'" y1="'+base+'" y2="'+base+'"/>';
  var ds=[];rows.forEach(function(r){if(ds.indexOf(r.d)<0)ds.push(r.d)});ds.sort();
  var few=ds.length<=14,xt=few?ds:atTicks(f,t),rot=xt.length>9,long=(d1-d0)/864e5>120;
  xt.forEach(function(s){
    var x=X(s),lab=(!few&&long)?MS[atPd(s).getMonth()]+' '+String(atPd(s).getFullYear()).slice(2):atFmt(s);
    o+='<line class="atick" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+base+'" y2="'+(base+5)+'"/>';
    if(few)o+='<line class="aguide" x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+T+'" y2="'+base+'"/>';
    if(rot)o+='<text class="atxt" transform="translate('+x.toFixed(1)+','+(base+18)+') rotate(-40)" text-anchor="end">'+lab+'</text>';
    else{o+='<text class="atxt" x="'+x.toFixed(1)+'" y="'+(base+20)+'" text-anchor="middle">'+lab+'</text>';
      if(few)o+='<text class="atxt asmall" x="'+x.toFixed(1)+'" y="'+(base+35)+'" text-anchor="middle">'+DOWS[atPd(s).getDay()]+'</text>'}
  });
  var lx=L;
  SVCS.forEach(function(s,i){
    var pts=rows.filter(function(r){return r.s===s}).sort(function(a,b){return a.d<b.d?-1:1});if(!pts.length)return;
    var cls=['aS','aP','aR'][i]||'aS';
    if(pts.length>1)o+='<path class="aline '+cls+'" d="'+pts.map(function(p,j){return (j?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.n).toFixed(1)}).join(' ')+'"/>';
    pts.forEach(function(p){
      var x=X(p.d),yy=Y(p.n);
      if(i===0)o+='<circle class="amk '+cls+'" cx="'+x.toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="5.5"/>';
      else if(i===1)o+='<rect class="amk '+cls+'" x="'+(x-5).toFixed(1)+'" y="'+(yy-5).toFixed(1)+'" width="10" height="10"/>';
      else o+='<polygon class="amk '+cls+'" points="'+x.toFixed(1)+','+(yy-6).toFixed(1)+' '+(x+5.5).toFixed(1)+','+(yy+4).toFixed(1)+' '+(x-5.5).toFixed(1)+','+(yy+4).toFixed(1)+'"/>';
      o+='<text class="aval" x="'+x.toFixed(1)+'" y="'+(yy-12).toFixed(1)+'" text-anchor="middle">'+p.n+'</text>';
    });
    o+='<line class="aline '+cls+'" x1="'+lx+'" x2="'+(lx+30)+'" y1="24" y2="24"/>';
    if(i===0)o+='<circle class="amk lg '+cls+'" cx="'+(lx+15)+'" cy="24" r="5.5"/>';
    else if(i===1)o+='<rect class="amk lg '+cls+'" x="'+(lx+10)+'" y="19" width="10" height="10"/>';
    else o+='<polygon class="amk lg '+cls+'" points="'+(lx+15)+',19 '+(lx+20.5)+',29 '+(lx+9.5)+',29"/>';
    o+='<text class="alegend" x="'+(lx+38)+'" y="29">'+s+'</text>';
    lx+=220;
  });
  return o+'</svg>';
}
function atStatCard(name,s,cls){
  return '<div class="panel astat"><h3><span class="adot '+cls+'"></span>'+name+'</h3><dl>'
   +'<dt>Services recorded</dt><dd>'+s.n+'</dd>'
   +'<dt>Members / regulars</dt><dd>'+s.sm+'</dd><dt>Visitors</dt><dd>'+s.sv+'</dd><dt>Total attendance</dt><dd>'+(s.sm+s.sv)+'</dd>'
   +'<dt>Average ('+atViewShort()+')</dt><dd>'+s.avg+'</dd>'
   +'<dt>Highest ('+atViewShort()+')</dt><dd>'+s.mx.n+' <small>('+atFmt(s.mx.d)+')</small></dd><dt>Lowest ('+atViewShort()+')</dt><dd>'+s.mn.n+' <small>('+atFmt(s.mn.d)+')</small></dd></dl></div>';
}

async function loadAtt(){
  try{ATT.rows=JSON.parse(await gs('getAttendance'));ATT.loaded=true;ATT.err=''}
  catch(e){ATT.err=errText(e)}
  if(S.view==='attendance')render();
  checkAutoInactive();
}
function checkAutoInactive(){
  if(!ATT.loaded||!ATT.rows.length||!S.members.length)return;
  // Get last 3 Sundays with attendance
  var sundays=[],seen={};
  ATT.rows.slice().sort(function(a,b){return a.d>b.d?-1:1}).forEach(function(r){if(!seen[r.d]){seen[r.d]=true;sundays.push(r.d)}});
  if(sundays.length<3)return;
  var last3=sundays.slice(0,3);
  // Build set of member IDs who attended any of the last 3 recorded dates (via checklist)
  var attended=new Set();
  ATT.rows.forEach(function(r){if(last3.indexOf(r.d)>=0&&r.cl){r.cl.split(',').forEach(function(id){if(id)attended.add(id)})}});
  if(!attended.size)return; // no checklist data
  S.members.forEach(function(m){
    if(m.status==='Member'||m.status==='Regular attendee'){
      if(!attended.has(m.id)){m._autoInactive=true}else{m._autoInactive=false}
    }
  });
}

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-att]');if(!el)return;
  var a=el.dataset.att,d=el.dataset.d,s=el.dataset.s,td=atYmd(new Date());

  if(a==='prev'||a==='next'){
    var dir=a==='next'?1:-1;
    if(AU.mode==='month'){var m=(AU.month||td.slice(0,7)).split('-');var nd=new Date(+m[0],+m[1]-1+dir,1);AU.month=nd.getFullYear()+'-'+atPad(nd.getMonth()+1)}
    else AU.week=atYmd(atAdd(atPd(AU.week||td),7*dir));
    render();return;
  }
  if(a==='edit'){
    var r=ATT.rows.filter(function(x){return x.d===d&&x.s===s})[0];if(!r)return;
    AF={d:r.d,s:r.s,n:String(r.n),v:String(r.v||0),note:r.note||'',cl:r.cl?r.cl.split(',').filter(Boolean):[]};AU.edit=true;render();
    var f=$('#attForm');if(f&&f.scrollIntoView)f.scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  if(a==='cancel'){AU.edit=false;AF.n='';AF.v='';AF.note='';render();return}
  if(a==='del'){
    var key=d+'|'+s;
    if(AU.armed!==key){AU.armed=key;render();setTimeout(function(){if(AU.armed===key){AU.armed='';if(S.view==='attendance')render()}},4000);return}
    AU.armed='';
    try{await gs('deleteAttendance',d,s);ATT.rows=ATT.rows.filter(function(x){return !(x.d===d&&x.s===s)});toast('Deleted');render()}
    catch(ex){toast(errText(ex));render()}
  }
});
document.addEventListener('submit',async function(e){
  if(e.target.id!=='attForm')return;
  e.preventDefault();
  var d=AF.d,s=AF.s,n=AF.n;
  if(!d){toast('Please choose the date');return}
  if(n===''||isNaN(+n)||+n<0){toast('Please enter how many members / regular attendees');return}
  if(AF.v!==''&&(isNaN(+AF.v)||+AF.v<0)){toast('Please enter a valid number of visitors');return}
  try{
    await gs('saveAttendance',JSON.stringify({d:d,s:s,n:+n,v:AF.v===''?0:+AF.v,note:AF.note,cl:AF.cl.join(',')}));
    var rec={d:d,s:s,n:Math.round(+n),v:AF.v===''?0:Math.round(+AF.v),note:AF.note||'',cl:AF.cl.join(',')},i=-1;
    ATT.rows.forEach(function(r,j){if(r.d===d&&r.s===s)i=j});
    if(i>=0)ATT.rows[i]=rec;else ATT.rows.push(rec);
    var rg=atRange();
    AF.n='';AF.v='';AF.note='';AF.cl=[];AU.edit=false;render();
    toast((d<rg.f||d>rg.t)?'Saved. That date is outside the period shown above.':'Saved');
  }catch(ex){toast(errText(ex))}
});

/* ---------- rendering ---------- */
function render(){
  $('#churchName').textContent=S.settings.church||'Cornerstone';
  document.title=(S.settings.church||'Church')+' Directory';
  const t=today(),cm=t.getMonth()+1;
  const bc=birthdayEvents().filter(e=>e.b.m===cm).length;
  const tabs=[['directory','Directory',S.members.length],['birthdays','Birthdays',bc],['ministries','Ministries',0],['attendance','Attendance',0],['demographics','Demographics',0],['settings','Settings',0]];
  $('#tabs').innerHTML=tabs.map(x=>`<button class="tab" data-act="tab" data-v="${x[0]}" ${S.view===x[0]?'aria-current="page"':''}>${x[1]}${x[2]?`<span class="n">${x[2]}</span>`:''}</button>`).join('');
  const app=$('#app');
  const fxKey=LOCKEY+'|'+S.view+'|'+S.loaded;
  if(app._fx!==fxKey){app._fx=fxKey;app.classList.remove('fx');void app.offsetWidth;app.classList.add('fx')}
  if(!S.loaded){app.innerHTML='<p class="loading">Loading members…</p>';renderModal();return}
  if(S.view==='directory'){app.innerHTML=directoryHTML();renderList()}
  else if(S.view==='birthdays')app.innerHTML=birthdaysHTML();
  else if(S.view==='ministries')app.innerHTML=ministriesHTML();
  else if(S.view==='attendance')app.innerHTML=attendanceHTML();
  else if(S.view==='demographics')app.innerHTML=demographicsHTML();
  else if(S.view==='dashboard')app.innerHTML=dashboardHTML();
  else app.innerHTML=settingsHTML();
  renderModal();
}

function filtered(){

    const hay=[fullName(m),m.phone,m.email,m.address,(m.ministries||[]).join(' '),(m.family||[]).map(famName).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);

function birthdayEvents(){
  const ev=[];
  for(const m of S.members){
    if(validB(m.birthday))ev.push({name:fullName(m),sub:m.status||'',b:m.birthday,id:m.id});
    if(S.incFam)for(const f of (m.family||[])){
      if(f.linkId&&byId(f.linkId))continue;
      if(validB(f.birthday))ev.push({name:f.name||'Family member',sub:(f.rel||'Family')+' of '+fullName(m),b:f.birthday,id:m.id});
    }
  }
  return ev;
}
function birthdaysHTML(){
  if(!S.members.length)return emptyHTML();
  const t=today(),cm=t.getMonth()+1,td=t.getDate(),ty=t.getFullYear();
  const ev=birthdayEvents();
  const todays=ev.filter(e=>e.b.m===cm&&e.b.d===td);
  let out=`<div class="bhead"><div><h2>Birthdays</h2><p class="sub">Starting from ${MONTHS[cm-1]}, in calendar order.</p></div>
    <div class="acts"><label class="check"><input type="checkbox" id="incFam" ${S.incFam?'checked':''}>Include family members</label>
    <button class="btn" data-act="copyMonth">Copy this month</button></div></div>`;
  if(todays.length)out+=`<div class="today"><b>Today:</b> ${todays.map(e=>esc(e.name)).join(', ')}</div>`;
  let any=false;
  for(let off=0;off<12;off++){
    const mo=((cm-1+off)%12)+1,yr=mo>=cm?ty:ty+1;
    const list=ev.filter(e=>e.b.m===mo).sort((a,b)=>a.b.d-b.b.d||a.name.localeCompare(b.name));
    if(!list.length&&off>0)continue;
    any=any||list.length>0;
    out+=`<section class="bmonth"><h3>${MONTHS[mo-1]}<span>${list.length} ${list.length===1?'birthday':'birthdays'}</span></h3><div class="list">`;
    if(!list.length)out+='<p class="loading">No birthdays this month.</p>';
    out+=list.map(e=>{
      const passed=off===0&&e.b.d<td,isNow=off===0&&e.b.d===td;
      const age=e.b.y?yr-e.b.y:null;
      const when=passed?'Earlier this month':relDays(daysUntil(e.b.m,e.b.d));
      return `<button class="bitem ${passed?'passed':''}" data-act="open" data-id="${esc(e.id)}">
        <span class="day ${isNow?'now':''}"><b>${e.b.d}</b><i>${MS[mo-1]}</i></span>
        <span class="who"><b>${esc(e.name)}</b><span>${esc(e.sub)}${age?`${e.sub?' · ':''}${passed||isNow?'turns':'turns'} ${age}`:''}</span></span>
        <span class="when">${when}</span></button>`;
    }).join('');
    out+='</div></section>';
  }
  if(!any)out+='<div class="empty"><h2>No birthdays saved</h2><p>Add a birthday to a member or a family member and it will show up here.</p></div>';
  return out;
}
function copyMonthText(){
  const cm=today().getMonth()+1;
  const list=birthdayEvents().filter(e=>e.b.m===cm).sort((a,b)=>a.b.d-b.b.d);
  if(!list.length)return '';
  const yr=today().getFullYear();
  return 'Birthdays in '+MONTHS[cm-1]+':\n'+list.map(e=>'• '+MS[cm-1]+' '+e.b.d+' – '+e.name+(e.b.y?' (turns '+(yr-e.b.y)+')':'')).join('\n');
}

/* ---------- demographics ---------- */
function pieSvg(data,title){
  if(!data.length)return '<p class="sub">No data yet.</p>';
  var colors=['#17703a','#5b8def','#c8202f','#f7a600','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
  var total=0;data.forEach(function(d){total+=d.v});if(!total)return '<p class="sub">No data.</p>';
  var cx=80,cy=80,r=70,a=-Math.PI/2,svg='<svg class="pie-svg" viewBox="0 0 160 160" width="160" height="160">';
  data.forEach(function(d,i){
    var slice=d.v/total*2*Math.PI;if(slice<0.01)return;
    var x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a);
    a+=slice;
    var x2=cx+r*Math.cos(a),y2=cy+r*Math.sin(a);
    var large=slice>Math.PI?1:0;
    svg+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+colors[i%colors.length]+'"/>';
  });
  svg+='</svg>';
  var legend='<div class="pie-legend">'+data.map(function(d,i){return '<div><span class="pie-swatch" style="background:'+colors[i%colors.length]+'"></span>'+esc(d.l)+' <b>'+d.v+'</b> <span class="sub">('+Math.round(d.v/total*100)+'%)</span></div>'}).join('')+'</div>';
  return '<div class="pie-wrap"><h3>'+esc(title)+'</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+svg+legend+'</div></div>';
}
function demographicsHTML(){
  if(!S.members.length)return emptyHTML();
  var active=S.members.filter(function(m){return m.status!=='Inactive'&&m.status!=='Transferred'});
  var inactive=S.members.filter(function(m){return m.status==='Inactive'}).length;
  var transferred=S.members.filter(function(m){return m.status==='Transferred'}).length;
  // Gender
  var gc={};S.members.forEach(function(m){if(m.gender){gc[m.gender]=(gc[m.gender]||0)+1}});
  var gd=Object.keys(gc).map(function(k){return {l:k,v:gc[k]}});
  // Age
  var ages=[0,0,0,0,0,0];var ageLabels=['Under 13','13–17','18–25','26–40','41–60','Over 60'];
  S.members.forEach(function(m){var a=memberAge(m);if(a===null)return;if(a<13)ages[0]++;else if(a<18)ages[1]++;else if(a<26)ages[2]++;else if(a<41)ages[3]++;else if(a<61)ages[4]++;else ages[5]++});
  var ad=ageLabels.map(function(l,i){return {l:l,v:ages[i]}}).filter(function(d){return d.v>0});
  // Nationality
  var nc={};S.members.forEach(function(m){if(m.nationality){nc[m.nationality]=(nc[m.nationality]||0)+1}});
  var nd=Object.keys(nc).map(function(k){return {l:k,v:nc[k]}}).sort(function(a,b){return b.v-a.v});
  // Status
  var sc={};S.members.forEach(function(m){sc[m.status]=(sc[m.status]||0)+1});
  var sd=Object.keys(sc).map(function(k){return {l:k,v:sc[k]}});
  // Ministry participation
  var mc={};S.members.forEach(function(m){(m.ministries||[]).forEach(function(n){mc[n]=(mc[n]||0)+1})});
  var md=Object.keys(mc).map(function(k){return {l:k,v:mc[k]}}).sort(function(a,b){return b.v-a.v});
  return '<div class="bhead"><div><h2>Demographics</h2><p class="sub">Church-wide statistics and breakdowns &mdash; '+S.members.length+' total members</p></div></div>'
    +'<div class="dash-stats"><div class="dash-stat"><b>'+active.length+'</b><span>Active</span></div><div class="dash-stat"><b>'+inactive+'</b><span>Inactive</span></div><div class="dash-stat"><b>'+transferred+'</b><span>Transferred</span></div></div>'
    +'<div class="demo-grid">'+pieSvg(gd,'Gender')+pieSvg(ad,'Age Groups')+pieSvg(nd,'Nationality')+pieSvg(sd,'Status')+pieSvg(md,'Ministry Participation')+'</div>';
}

    return `<li><span><span class="rel">${esc(f.rel||'Family')}</span><br>${lm?`<button class="btn link" data-act="open" data-id="${esc(lm.id)}">${esc(fullName(lm))}</button>`:esc(f.name||'Unnamed')}</span><span class="bd">${validB(b)?esc(bText(b,true)):''}</span></li>`}).join('')}</ul>`:'<p class="sub">No family added yet.</p>'}
    <div style="margin-top:10px"><button class="btn small" data-act="addFamily" data-id="${esc(x.id)}">Add family member</button></div></div>
  ${(x.socialMedia||[]).length?`<div class="sec"><h3>Social Media</h3><div class="sm-links">${x.socialMedia.map(sm=>`<span class="sm-link"><b>${esc(sm.platform||'')}</b> ${esc(sm.handle||'')}</span>`).join('')}</div></div>`:''}
  ${x.notes?`<div class="sec"><h3>Notes</h3><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.notes)}</p></div>`:''}
  <div class="foot">${m.confirmDel
    ?`<span class="inline-confirm lead">Delete ${esc(fullName(x))} for good?</span><button class="btn" data-act="delNo">Keep</button><button class="btn danger solid" data-act="delYes">Delete</button>`
    :`<button class="btn danger lead" data-act="delAsk">Delete</button><button class="btn" data-act="dashboard" data-id="${esc(x.id)}">Dashboard</button><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="edit" data-id="${esc(x.id)}">Edit</button>`}</div>`;
}
function pickHTML(){
  const list=sortedMembers();
  return `<div class="shead" style="grid-template-columns:minmax(0,1fr) auto"><h2>Add family to…</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  ${list.length?`<div class="list">${list.map(x=>`<button class="row" style="grid-template-columns:auto minmax(0,1fr)" data-act="addFamily" data-id="${esc(x.id)}"><span class="avatar" aria-hidden="true">${esc(initials(x))}</span><span class="who"><b>${esc(fullName(x))}</b><span>${(x.family||[]).length} family member${(x.family||[]).length===1?'':'s'} saved</span></span></button>`).join('')}</div>`:'<p class="sub">Add a member first, then you can add their family.</p>'}`;
}

const blankB=()=>({m:0,d:0,y:''});
const blankFam=()=>({rel:'Spouse',linkId:'',name:'',birthday:blankB()});
function newDraft(){return {id:uid('m'),first:'',last:'',status:'Member',phone:'',email:'',address:'',birthday:blankB(),ministries:[],notes:'',family:[],gender:'',nationality:'',dateBaptism:'',dateJoined:'',socialMedia:[]}}
function draftFrom(x){
  const d=JSON.parse(JSON.stringify(x));
  d.birthday=Object.assign(blankB(),d.birthday||{});d.birthday.y=d.birthday.y||'';
  d.ministries=d.ministries||[];d.family=(d.family||[]).map(f=>Object.assign(blankFam(),f,{birthday:Object.assign(blankB(),f.birthday||{})}));
  d.family.forEach(f=>{f.birthday.y=f.birthday.y||''});
  d.gender=d.gender||'';d.nationality=d.nationality||'';d.dateBaptism=d.dateBaptism||'';d.dateJoined=d.dateJoined||'';d.socialMedia=d.socialMedia||[];
  return d;
}
function bdayFields(b,scope){
  const mo=`<select data-b="m" data-scope="${scope}" aria-label="Birth month"><option value="0">Month</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${b.m===i+1?'selected':''}>${n}</option>`).join('')}</select>`;
  const da=`<select data-b="d" data-scope="${scope}" aria-label="Birth day"><option value="0">Day</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${b.d===i+1?'selected':''}>${i+1}</option>`).join('')}</select>`;
  const yr=`<input type="number" inputmode="numeric" data-b="y" data-scope="${scope}" placeholder="Year (optional)" min="1900" max="2100" value="${esc(b.y)}" aria-label="Birth year">`;
  return `<div class="bday">${mo}${da}${yr}</div>`;
}
function editHTML(m){
  const d=m.draft;
  const mins=[...new Set([...S.settings.ministries,...d.ministries])];
  const others=sortedMembers().filter(x=>x.id!==d.id);
  return `<div class="shead" style="grid-template-columns:minmax(0,1fr) auto"><h2>${m.isNew?'Add member':'Edit '+esc(fullName(d))}</h2><button class="x" data-act="cancelEdit" aria-label="Close">×</button></div>
  <form id="editForm" autocomplete="off" novalidate>
  <div class="grid2">
    <label class="field"><span>First name</span><input type="text" id="f-first" data-f="first" value="${esc(d.first)}"></label>
    <label class="field"><span>Last name</span><input type="text" data-f="last" value="${esc(d.last)}"></label>
    <label class="field"><span>Status</span><select data-f="status">${STATUS.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="field"><span>Gender</span><select data-f="gender"><option value="">—</option>${GENDERS.map(g=>`<option ${d.gender===g?'selected':''}>${g}</option>`).join('')}</select></label>
    <label class="field"><span>Phone</span><input type="tel" data-f="phone" value="${esc(d.phone)}"></label>
    <label class="field"><span>Email</span><input type="email" data-f="email" value="${esc(d.email)}"></label>
    <label class="field"><span>Address</span><input type="text" data-f="address" value="${esc(d.address)}"></label>
    <label class="field"><span>Nationality</span><input type="text" data-f="nationality" value="${esc(d.nationality)}" placeholder="e.g. Filipino"></label>
  </div>
  <div class="field" style="margin-top:12px"><span>Birthday</span>${bdayFields(d.birthday,'self')}</div>
  <div class="grid2" style="margin-top:12px">
    <label class="field"><span>Date of Baptism</span><input type="text" data-f="dateBaptism" value="${esc(d.dateBaptism)}" placeholder="e.g. June 5, 2020"></label>
    <label class="field"><span>Date Joined</span><input type="text" data-f="dateJoined" value="${esc(d.dateJoined)}" placeholder="e.g. January 2019"></label>
  </div>
  <div class="sec"><h3>Social Media</h3>
    <div id="smSec">${(d.socialMedia||[]).map((sm,i)=>`<div class="grid2" style="margin-bottom:8px"><label class="field"><span>Platform</span><select data-sm="${i}" data-sk="platform">${SM_PLATFORMS.map(p=>`<option ${sm.platform===p?'selected':''}>${p}</option>`).join('')}</select></label><label class="field"><span>Handle / URL</span><input type="text" data-sm="${i}" data-sk="handle" value="${esc(sm.handle||'')}"></label></div>`).join('')}
    <button type="button" class="btn small" data-act="addSm">+ Add social media</button></div>
  <div class="sec"><h3>Ministries</h3><div class="picks">${mins.map(n=>`<button type="button" class="pick" data-act="toggleMin" data-name="${esc(n)}" aria-pressed="${d.ministries.includes(n)}">${esc(n)}</button>`).join('')||'<span class="sub">Add ministries in Settings.</span>'}</div></div>
  <div class="sec" id="famSec"><h3>Family</h3>
    ${d.family.map((f,i)=>`<div class="famrow"><div class="top2"><label class="field" style="flex:1"><span>Relationship</span><select data-fam="${i}" data-k="rel">${REL.map(r=>`<option ${f.rel===r?'selected':''}>${r}</option>`).join('')}</select></label><button type="button" class="btn small danger" data-act="delFam" data-i="${i}">Remove</button></div>
      <label class="field"><span>Existing member</span><select data-fam="${i}" data-k="linkId" data-struct="1"><option value="">Not a member yet</option>${others.map(o=>`<option value="${esc(o.id)}" ${f.linkId===o.id?'selected':''}>${esc(fullName(o))}</option>`).join('')}</select></label>
      ${f.linkId?'':`<label class="field"><span>Name</span><input type="text" id="fam-name-${i}" data-fam="${i}" data-k="name" value="${esc(f.name)}"></label><div class="field"><span>Birthday</span>${bdayFields(f.birthday,String(i))}</div>`}</div>`).join('')}
    <button type="button" class="btn small" data-act="addFamRow">+ Add family member</button></div>
  <div class="sec"><label class="field"><span>Notes</span><textarea data-f="notes">${esc(d.notes)}</textarea></label></div>
  ${m.err?`<p class="err">${esc(m.err)}</p>`:''}
  <div class="foot"><button type="button" class="btn" data-act="cancelEdit">Cancel</button><button type="submit" class="btn primary">${m.isNew?'Save member':'Save changes'}</button></div></form>`;
}
function cleanBirthday(b){return validB(b)?Object.assign({m:+b.m,d:+b.d},b.y?{y:+b.y}:{}):{m:0,d:0}}
async function saveDraft(){
  const m=S.modal,d=m.draft;
  const bad=b=>(+b.m>0)!==(+b.d>0);
  if(!d.first.trim()&&!d.last.trim()){m.err='Enter a first or last name.';m.focus='#f-first';renderModal();return}
  if(bad(d.birthday)||d.family.some(f=>!f.linkId&&bad(f.birthday))){m.err='Choose both a month and a day for each birthday, or leave both empty.';renderModal();return}
  const rec={id:d.id,first:d.first.trim(),last:d.last.trim(),status:d.status,phone:d.phone.trim(),email:d.email.trim(),address:d.address.trim(),birthday:cleanBirthday(d.birthday),ministries:d.ministries.slice(),notes:d.notes.trim(),
    gender:d.gender||'',nationality:(d.nationality||'').trim(),dateBaptism:(d.dateBaptism||'').trim(),dateJoined:(d.dateJoined||'').trim(),socialMedia:(d.socialMedia||[]).filter(sm=>sm.handle&&sm.handle.trim()),
    family:d.family.filter(f=>f.linkId||f.name.trim()).map(f=>{const lm=f.linkId&&byId(f.linkId);return {rel:f.rel,linkId:f.linkId||'',name:lm?fullName(lm):f.name.trim(),birthday:f.linkId?{m:0,d:0}:cleanBirthday(f.birthday)}})};
  if(d.sample)rec.sample=true;
  try{await putMember(rec);S.modal={type:'view',id:rec.id};render();toast('Saved '+fullName(rec))}
  catch(e){m.err='Could not save. Check that you have edit access to the spreadsheet.';renderModal()}
}

/* ---------- sample data ---------- */
async function loadSamples(){
  const t=today();
  const off=n=>{const x=new Date(t.getFullYear(),t.getMonth(),t.getDate()+n);return {m:x.getMonth()+1,d:x.getDate()}};
  const mk=(first,last,status,phone,mins,n,y)=>({id:uid('s'),first,last,status,phone,email:'',address:'Balanga, Bataan',ministries:mins,notes:'',birthday:Object.assign(off(n),{y}),family:[],sample:true});
  const maria=mk('Maria','Santos','Member','0917 555 0101',['Worship Team','Prayer'],1,1984);
  const jose=mk('Jose','Santos','Member','0917 555 0102',['Ushering',"Men's Fellowship"],46,1981);
  maria.family=[{rel:'Spouse',linkId:jose.id,name:'Jose Santos',birthday:{m:0,d:0}},{rel:'Child',linkId:'',name:'Ana Santos',birthday:Object.assign(off(9),{y:2015})}];
  jose.family=[{rel:'Spouse',linkId:maria.id,name:'Maria Santos',birthday:{m:0,d:0}}];
  const elena=mk('Elena','Reyes','Member','0917 555 0103',['Youth','Children'],20,1999);
  const ramon=mk('Ramon','dela Cruz','Member','0917 555 0104',['Media','Worship Team'],-3,1990);
  const liza=mk('Liza','Bautista','Regular attendee','0917 555 0105',['Hospitality',"Women's Fellowship"],75,1975);
  try{for(const x of [jose,maria,elena,ramon,liza])await putMember(x);toast('Loaded 5 sample members')}
  catch(e){toast('Could not save. Check that you have edit access to the spreadsheet.')}
}
async function exportCsv(){
  if(!dl)return;
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['First name','Last name','Status','Gender','Phone','Email','Address','Birthday','Nationality','Date of Baptism','Date Joined','Ministries','Family','Social Media','Notes']];
  sortedMembers().forEach(m=>rows.push([m.first,m.last,m.status,m.gender||'',m.phone,m.email,m.address,bText(m.birthday,true),m.nationality||'',dateStr(m.dateBaptism),dateStr(m.dateJoined),(m.ministries||[]).join('; '),(m.family||[]).map(f=>(f.rel||'')+': '+famName(f)).join('; '),(m.socialMedia||[]).map(sm=>(sm.platform||'')+': '+(sm.handle||'')).join('; '),m.notes]));
  try{await dl.save({filename:'church-members.csv',data:'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')});toast('Export ready')}
  catch(e){if(!e||e.code!=='declined')toast('Could not export here.')}
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='backdrop'){if(e.target===el&&!el.dataset.lock){S.modal=null;renderModal()}return}
  if(act==='tab'){S.view=el.dataset.v;render();if(S.view==='attendance')loadAtt();window.scrollTo(0,0)}
  else if(act==='add'){S.modal={type:'edit',draft:newDraft(),isNew:true,focus:'#f-first'};renderModal()}
  else if(act==='open'){S.modal={type:'view',id};renderModal()}
  else if(act==='dashboard'){S.modal=null;S.dashMember=id;S.dashAtt=null;S.view='dashboard';render();gs('getMemberAttendance',id).then(function(r){S.dashAtt=JSON.parse(r);if(S.view==='dashboard')render()}).catch(function(){S.dashAtt=[];if(S.view==='dashboard')render()})}
  else if(act==='closeDash'){S.view='directory';render()}
  else if(act==='close'){S.modal=null;renderModal()}
  else if(act==='edit'){S.modal={type:'edit',draft:draftFrom(byId(id)),isNew:false};renderModal()}
  else if(act==='cancelEdit'){const m=S.modal;S.modal=m.isNew?null:{type:'view',id:m.draft.id};renderModal()}
  else if(act==='addFamily'){const x=byId(id);if(!x)return;const d=draftFrom(x);d.family.push(blankFam());S.modal={type:'edit',draft:d,isNew:false,focus:'#fam-name-'+(d.family.length-1)};renderModal()}
  else if(act==='pickFamily'){S.modal={type:'pick'};renderModal()}
  else if(act==='delAsk'){S.modal.confirmDel=true;renderModal()}
  else if(act==='delNo'){S.modal.confirmDel=false;renderModal()}
  else if(act==='delYes'){const nm=fullName(byId(S.modal.id));try{await removeMember(S.modal.id);S.modal=null;render();toast('Deleted '+nm)}catch(err){toast('Could not delete. Check that you have edit access to the spreadsheet.')}}
  else if(act==='toggleMin'){const a=S.modal.draft.ministries,n=el.dataset.name,i=a.indexOf(n);if(i>=0)a.splice(i,1);else a.push(n);el.setAttribute('aria-pressed',String(i<0))}
  else if(act==='addSm'){const d=S.modal.draft;if(!d.socialMedia)d.socialMedia=[];d.socialMedia.push({platform:'Facebook',handle:''});renderModal()}
  else if(act==='addFamRow'){const d=S.modal.draft;d.family.push(blankFam());S.modal.focus='#fam-name-'+(d.family.length-1);renderModal()}
  else if(act==='delFam'){S.modal.draft.family.splice(+el.dataset.i,1);renderModal()}
  else if(act==='sample'){await loadSamples()}
  else if(act==='sort'){S.sort=el.dataset.v;render()}
  else if(act==='filterMin'){S.view='directory';S.fMin=el.dataset.name;S.q='';S.fStatus='';render();window.scrollTo(0,0)}
  else if(act==='copyMonth'){
    const txt=copyMonthText();if(!txt){toast('No birthdays this month');return}
    try{await navigator.clipboard.writeText(txt);toast('Copied this month’s birthdays')}catch(err){toast('Copy is blocked here. Select the list and copy it.')}
  }
  else if(act==='delMin'){S.confirmMin=el.dataset.name;render()}
  else if(act==='delMinNo'){S.confirmMin='';render()}
  else if(act==='delMinYes'){
    const n=el.dataset.name;S.confirmMin='';
    try{
      for(const m of S.members.filter(x=>(x.ministries||[]).includes(n)))await putMember(Object.assign({},m,{ministries:m.ministries.filter(v=>v!==n)}));
      S.settings.ministries=S.settings.ministries.filter(v=>v!==n);await putSettings();toast('Removed '+n)
    }catch(err){toast('Could not remove. Check that you have edit access to the spreadsheet.');render()}
  }
  else if(act==='export'){await exportCsv()}
  else if(act==='clearSamples'){
    try{for(const m of S.members.filter(x=>x.sample))await removeMember(m.id);toast('Sample members removed')}catch(err){toast('Could not remove. Check that you have edit access to the spreadsheet.')}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;renderList();return}
  const m=S.modal;if(!m||m.type!=='edit')return;
  const d=m.draft;
  if(t.dataset.f){d[t.dataset.f]=t.value}
  else if(t.dataset.b){const b=t.dataset.scope==='self'?d.birthday:d.family[+t.dataset.scope].birthday;const k=t.dataset.b;b[k]=k==='y'?t.value:+t.value}
  else if(t.dataset.fam!==undefined&&!t.dataset.struct){d.family[+t.dataset.fam][t.dataset.k]=t.value}
  else if(t.dataset.sm!==undefined){if(!d.socialMedia)d.socialMedia=[];var si=+t.dataset.sm;if(d.socialMedia[si])d.socialMedia[si][t.dataset.sk]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fMin'){S.fMin=t.value;renderList();return}
  if(t.id==='fStatus'){S.fStatus=t.value;renderList();return}
  if(t.id==='fFamily'){S.fFamily=t.value;renderList();return}
  if(t.id==='incFam'){S.incFam=t.checked;render();return}
  if(t.id==='setChurch'){S.settings.church=t.value.trim()||'Cornerstone';putSettings().then(()=>toast('Church name saved')).catch(()=>toast('Could not save. Check that you have edit access to the spreadsheet.'));return}
  const m=S.modal;if(!m||m.type!=='edit')return;
  if(t.dataset.struct&&t.dataset.fam!==undefined){
    const f=m.draft.family[+t.dataset.fam];f.linkId=t.value;
    if(t.value){const lm=byId(t.value);if(lm)f.name=fullName(lm)}
    renderModal();
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='editForm'){await saveDraft();return}
  if(e.target.id==='minForm'){
    const inp=$('#newMin');const n=inp.value.trim();
    if(!n)return;
    if(S.settings.ministries.some(x=>x.toLowerCase()===n.toLowerCase())){toast('That ministry is already listed');return}
    S.settings.ministries=S.settings.ministries.concat(n);
    try{await putSettings();toast('Added '+n)}catch(err){toast('Could not save. Check that you have edit access to the spreadsheet.')}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal&&S.modal.type!=='edit'){S.modal=null;renderModal()}
});

boot();
})();
</script>
